[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vera-mmu"
version = "0.1.0rc1"
description = "Verifiable epistemics, relational provenance, and auditable continuity for AI-assisted projects"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "VERA-MMU contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "PyYAML>=6.0,<7.0",
  "mcp>=2.0,<3.0",
]

[project.scripts]
vmmu = "vera_mmu.__main__:main"
vmmu-desktop-bridge = "vera_mmu.desktop_bridge:desktop_bridge_main"
vmmu-mcp = "vera_mmu.mcp_server:main"
vmmu-claude-code-local-hook = "vera_mmu.claude_code_local:claude_code_local_hook_main"
vmmu-claude-code-local-mcp = "vera_mmu.claude_code_local:claude_code_local_mcp_main"
vmmu-claude-code-cloud-hook = "vera_mmu.claude_code_cloud:claude_code_cloud_hook_main"
vmmu-claude-code-cloud-mcp = "vera_mmu.claude_code_cloud:claude_code_cloud_mcp_main"
vmmu-claude-code-cloud-stage = "vera_mmu.claude_code_cloud:claude_code_cloud_stage_main"
vmmu-claude-code-cloud-config = "vera_mmu.claude_code_cloud:claude_code_cloud_config_main"
vmmu-codex-stage = "vera_mmu.codex_adapter:codex_stage_main"
vmmu-codex-hook = "vera_mmu.codex_adapter:codex_hook_main"
vmmu-codex-mcp = "vera_mmu.codex_adapter:codex_mcp_main"
vmmu-codex-config = "vera_mmu.codex_adapter:codex_config_main"
vmmu-gemini-stage = "vera_mmu.gemini_adapter:gemini_stage_main"
vmmu-gemini-hook = "vera_mmu.gemini_adapter:gemini_hook_main"
vmmu-gemini-mcp = "vera_mmu.gemini_adapter:gemini_mcp_main"
vmmu-gemini-config = "vera_mmu.gemini_adapter:gemini_config_main"
vmmu-antigravity-stage = "vera_mmu.antigravity_adapter:antigravity_stage_main"
vmmu-antigravity-hook = "vera_mmu.antigravity_adapter:antigravity_hook_main"
vmmu-antigravity-mcp = "vera_mmu.antigravity_adapter:antigravity_mcp_main"
vmmu-antigravity-config = "vera_mmu.antigravity_adapter:antigravity_config_main"
vmmu-generic-mcp-stage = "vera_mmu.generic_mcp_adapter:generic_mcp_stage_main"
vmmu-generic-mcp = "vera_mmu.generic_mcp_adapter:generic_mcp_main"
vmmu-generic-mcp-config = "vera_mmu.generic_mcp_adapter:generic_mcp_config_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vera_mmu = ["schema/*.sql"]

[tool.unittest]
start-directory = "tests"
