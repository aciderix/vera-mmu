# Pose le tag et publie la release depuis GitHub, seul endroit qui en ait le droit.
#
# **Pourquoi ce workflow existe.** Un agent travaillant dans un conteneur proxifié ne peut écrire
# ni référence de tag ni release : le proxy refuse ces chemins quelles que soient les identités
# présentées. Un job, lui, tourne sur l'infrastructure GitHub et dispose de `contents: write`.
#
# **Ce qu'il refuse, et pourquoi c'est le point.** Un tag est une affirmation publique : il dit que
# ce commit *est* cette version. Trois garde-fous, chacun avant toute écriture :
#
#   1. le nom demandé doit être celui que les manifestes déclarent — dérivé, jamais saisi ;
#   2. le tag ne doit pas déjà exister — `v0.1.0-rc.4` est déjà publié sur une autre ligne, et le
#      réécrire laisserait tout clone l'ayant récupéré sur l'ancien ;
#   3. la suite de conformité, les tests desktop et les deux bundles doivent passer sur les deux
#      plateformes, sur le commit publié — pas sur un run antérieur qu'on lui ressemblerait.
#
# Les artefacts publiés sont donc construits à partir du commit tagué, dans le même run. Réutiliser
# ceux d'un run précédent supposerait qu'ils correspondent ; ici on le sait.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Nom du tag (dérivé des manifestes, ex. v0.1.0-rc.5)"
        required: true
        type: string
      prerelease:
        description: "Publier comme pre-release (décocher pour une version finale)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  guard:
    name: Vérifier le tag demandé
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Dérivé des quatre manifestes plutôt que cru sur parole : poser `v0.1.0-rc.5` sur un arbre
      # qui déclare `0.1.0rc4` produirait un mensonge que plus personne ne relit.
      - name: Le tag correspond-il à la version déclarée ?
        run: python scripts/release_tag.py --check "${{ inputs.tag }}"
      # Un tag déjà publié ne se réécrit pas : les clones qui l'ont récupéré garderaient l'ancien.
      - name: Le tag est-il déjà pris ?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/${{ inputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Le tag ${{ inputs.tag }} existe déjà. Choisir un nom libre ; ne jamais réécrire un tag publié."
            exit 1
          fi
          echo "Tag ${{ inputs.tag }} libre."

  package:
    name: ${{ matrix.name }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
      - name: Install Linux bundle prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install VERA sidecar build dependencies
        run: python -m pip install --upgrade pip pyinstaller pytest pytest-xdist .
      - name: Run VERA conformance suite
        run: python -m pytest -q -n auto --dist loadfile
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Run desktop interface tests
        working-directory: apps/desktop
        run: pnpm test
      - name: Build native VERA sidecar
        run: python scripts/build_desktop_sidecar.py ${{ matrix.target }}
      # Après le sidecar : `tauri_build` résout les ressources déclarées dès le script de build,
      # et `binaries/vmmu-desktop-bridge-<triple>` n'existe qu'une fois le sidecar construit.
      - name: Run desktop backend tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Build standalone VERA CLI archive
        run: python scripts/build_cli_bundle.py ${{ matrix.target }}
      - name: Build desktop bundles
        working-directory: apps/desktop
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
      # Les deux plateformes produisent un `SHA256SUMS` homonyme : les distinguer ici évite qu'un
      # fichier écrase l'autre au moment de l'assemblage.
      - name: Rassembler les livrables
        shell: bash
        run: |
          mkdir -p livrables
          cp .build/cli-release/${{ matrix.target }}/vera-mmu-cli_* livrables/
          cp .build/cli-release/${{ matrix.target }}/release-manifest.json \
             "livrables/release-manifest-${{ matrix.target }}.json"
          cp .build/cli-release/${{ matrix.target }}/SHA256SUMS \
             "livrables/SHA256SUMS-${{ matrix.target }}"
          find apps/desktop/src-tauri/target/release/bundle -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} livrables/ \;
          ls -la livrables
      - uses: actions/upload-artifact@v4
        with:
          name: livrables-${{ matrix.target }}
          if-no-files-found: error
          path: livrables/**

  publish:
    name: Poser le tag et publier
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: livrables-*
          merge-multiple: true
          path: livrables
      # Dernière vérification avant publication : les deux manifestes doivent désigner le commit
      # que ce run construit. Un artefact lié à un autre build est exactement la dérive
      # silencieuse que ce produit refuse.
      - name: Les artefacts viennent-ils bien de ce commit ?
        run: |
          python - <<'PY'
          import json, pathlib, sys
          attendu = "${{ github.sha }}"
          manifestes = sorted(pathlib.Path("livrables").glob("release-manifest-*.json"))
          if len(manifestes) != 2:
              sys.exit(f"::error::{len(manifestes)} manifeste(s) trouvé(s), deux attendus.")
          for chemin in manifestes:
              m = json.loads(chemin.read_text(encoding="utf-8"))
              print(f"{m['platform']:12} {m['version']:10} {m['source_revision']}")
              if m["source_revision"] != attendu:
                  sys.exit(f"::error::{chemin.name} désigne {m['source_revision']}, pas {attendu}.")
          print("Les deux manifestes désignent le commit publié.")
          PY
      # **Par l'API, pas par `git push`.** Mesuré ici même : pousser un tag dont le commit touche
      # un fichier de `.github/workflows/` est refusé — « refusing to allow a GitHub App to
      # create or update workflow … without `workflows` permission » — et cette permission ne
      # peut pas être accordée à `GITHUB_TOKEN`. Le workflow s'est fait refuser par sa propre
      # introduction. L'API ne crée qu'une référence vers un objet déjà présent dans le dépôt :
      # aucun contenu de workflow n'est introduit, et la restriction ne s'applique pas.
      #
      # Deux appels plutôt qu'un pour garder le tag **annoté**, comme rc.1 à rc.4 : l'objet tag
      # porte le message, la référence le désigne. Un tag léger perdrait cette lignée.
      - name: Poser le tag annoté
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          objet=$(gh api "repos/${{ github.repository }}/git/tags" \
            -f tag="${{ inputs.tag }}" \
            -f message="VERA-MMU ${{ inputs.tag }}" \
            -f object="${{ github.sha }}" \
            -f type=commit --jq .sha)
          echo "objet tag : $objet"
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${{ inputs.tag }}" -f sha="$objet" --jq .ref
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # Comparaison explicite plutôt que la véracité de l'expression : dans les expressions
          # GitHub, **toute chaîne non vide est vraie**. Si cette entrée arrivait un jour comme la
          # chaîne "false" — via l'API, un workflow appelant, ou un changement de typage —
          # `inputs.prerelease && …` la tiendrait pour vraie et publierait une version finale en
          # pre-release. Le test l'aurait été ici, en silence, une fois sur cent.
          drapeau=""
          if [ "$PRERELEASE" = "true" ]; then drapeau="--prerelease"; fi
          notes=docs/release-notes/${{ inputs.tag }}.md
          if [ -f "$notes" ]; then
            gh release create "${{ inputs.tag }}" --title "VERA-MMU ${{ inputs.tag }}" \
              --notes-file "$notes" $drapeau livrables/*
          else
            echo "Pas de notes rédigées sous $notes : GitHub les génère depuis les commits."
            gh release create "${{ inputs.tag }}" --title "VERA-MMU ${{ inputs.tag }}" \
              --generate-notes $drapeau livrables/*
          fi
          gh release view "${{ inputs.tag }}" --json tagName,isPrerelease,assets \
            --jq '"tag: \(.tagName) | prerelease: \(.isPrerelease) | \(.assets | length) fichiers"'
