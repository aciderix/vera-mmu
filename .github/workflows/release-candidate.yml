name: Release candidate verification

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag ou commit à vérifier ; aucun artefact n’est publié comme release"
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux bundle prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils xvfb
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller pytest .
      - name: Run VERA conformance suite
        run: python -m pytest -q
      - name: Build native sidecar and CLI
        run: |
          python scripts/build_desktop_sidecar.py ${{ matrix.target }}
          python scripts/build_cli_bundle.py ${{ matrix.target }}
      - name: Build desktop bundles
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles ${{ matrix.bundles }}
      - name: Assemble non-signed release candidate
        run: python scripts/assemble_release_candidate.py ${{ matrix.target }}
      - name: Smoke Linux release runtime
        if: runner.os == 'Linux'
        run: python scripts/smoke_release_runtime.py ${{ matrix.target }}
      - name: Smoke Windows release runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke_windows_release.ps1 -CandidateDirectory .build/release-candidate/${{ matrix.target }}
      - name: Upload non-signed candidate for verification
        uses: actions/upload-artifact@v4
        with:
          name: vera-mmu-release-candidate-${{ matrix.target }}
          if-no-files-found: error
          path: .build/release-candidate/${{ matrix.target }}/**
